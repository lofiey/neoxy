[package]
name = "neoxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "webpki-roots"] }

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
mime_guess = "2"
httpdate = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
