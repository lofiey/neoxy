listen: 0.0.0.0:443
redirecthttps: 0.0.0.0:80
fallback: 127.0.0.1:8080
http3: true

acmeemail: set@yourmail.com
acmecache: /opt/neoxy/acme

vhosts:
  - name: yourdomain.com
    tlsoffloading: true
    managedcert: true
    alpn: h2
    protocols: tls13
    http:
      handler: fileServer
      args: /var/www/html
    default:
      handler: proxyPass
      args: unix:@v2ray.sock
